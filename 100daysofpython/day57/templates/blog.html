<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
</head>
<body>
    <h1>Blog</h1>
    {% for i in all_posts: %}
        {% if i['id'] == 2: %}

            <h2>{{i['title']}}</h2>
            <h3>{{i['subtitle']}}</h3>
        {% else: %}
        {%endif%}
    {% endfor%}
</body>
</html>
